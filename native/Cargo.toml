[package]
name = "iventello-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2.16"
calamine = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.1", features = ["deflate"] }
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
napi-build = "2.3"
