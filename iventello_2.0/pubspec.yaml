name: iventello
description: "Point de Vente & Gestion de Stock Industriel Haute Performance"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Persistance locale SQLite FFI & Performance
  drift: ^2.18.0
  sqlite3: ^2.4.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Pont Natif Rust (v2)
  flutter_rust_bridge: ^2.0.0

  # Utilitaires, Identifiants & Formatage
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/iventello.png
    - assets/onboarding/
